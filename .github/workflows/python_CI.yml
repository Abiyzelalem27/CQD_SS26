name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src

    steps:
    - uses: actions/checkout@v4

    - name: Show files
      run: |
        pwd
        ls
        ls src
        ls src/Comp_Quant_Dynam

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Check import
      run: |
        python -c "import Comp_Quant_Dynam; print(Comp_Quant_Dynam)"
        python -c "import Comp_Quant_Dynam.hamiltonians as ham; print('hamiltonians OK')"

    - name: Run tests
      run: |
        pytest --cov=. --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v4
